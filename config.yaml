# FuzzyRoute-RAG experiment configuration (spec v0.3, sections 2.6 and 7.5).
#
# Every reported result must be reproducible from this file plus a commit ID of this repo.
# Values here must equal the constants in main_logic/ — tests/test_config.py checks that, so the
# file and the code cannot silently disagree. Section numbers refer to the spec.
#
# Every spec 9.3 pin is now here (stage 3 pins added Oct 11).

data:
  root: D:/Han/rex_rag/data
  corpus: D:/Han/rex_rag/data/dpr/psgs_w100.tsv.gz
  embeddings: D:/Han/rex_rag/data/contriever-msmarco/wikipedia_embeddings
  bm25_index: D:/Han/rex_rag/data/bm25/lucene-inverted.wikipedia-dpr-100w.20260508.deb4c7b
  # HotpotQA: BEIR abstracts. Prebuilt pyserini indexes; corpus exported by scripts/export_corpus.py
  hotpotqa_corpus: D:/Han/rex_rag/data/hotpotqa/corpus.tsv.gz
  hotpotqa_embeddings: D:/Han/rex_rag/data/hotpotqa/faiss-flat.beir-v1.0.0-hotpotqa.contriever-msmarco.20230124
  hotpotqa_bm25_index: D:/Han/rex_rag/data/hotpotqa/lucene-inverted.beir-v1.0.0-hotpotqa.flat.20221116.505594
  # Question sources for the clusters (7.1): NQ-open dev and HotpotQA dev (fullwiki file)
  questions: D:/Han/rex_rag/data/nq/NQ-open.dev.jsonl
  hotpotqa_questions: D:/Han/rex_rag/data/hotpot_dev_fullwiki_v1.json

generator:                      # 1.3; llama.cpp b11505 llama-server on the desktop (Oct 10)
  model: D:/Han/rex_rag/data/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
  gpu_layers: 31                # of 33; fastest on the P2200 (RUNLOG_2026-10-08_hotpotqa)
  ctx: 4096

paraphrase:                     # 7.1, step 1 (user decisions, Oct 10)
  prompt: "Paraphrase this question: reword it using different words or sentence structure so that it still asks exactly the same thing. Do not add or remove information and do not include the answer."
  n_candidates: 5
  temperature: 0.7
  max_tokens: 64
  seed: 42                      # question sample; candidate i uses seed 42 + i
  per_cluster: 2                # first 2 passing candidates, in generation order
  cosine_min: 0.75              # spec 7.1: 0.85; user decision Oct 10
  nli_model: microsoft/deberta-large-mnli
  nli_revision: 7296194b9009373def4f7c5dad292651e4b5cf4e
  embed_model: sentence-transformers/all-mpnet-base-v2
  embed_revision: e8c3b32edf5434bc2275fc9bab85f82640a19130

retrieval:                      # 2.1, 7.2
  dense_model: facebook/contriever-msmarco
  dense_revision: abe8c1493371369031bcb1e02acb754cf4e162fa
  dense_max_length: 512
  bm25_k1: 0.9                  # pyserini default; adopted, to confirm (9.3)
  bm25_b: 0.4

signals:                        # 2
  k: 10                         # signal window
  pool: 50                      # fused pool size
  rbo_p: 0.9                    # 2.3
  tau: 0.1                      # 2.5, S4 softmax temperature

fuzzy:                          # 3.1-3.3
  centres: [0.35, 0.65]
  w_default: 0.20
  w_max: 0.25
  n_out: 1001                   # centroid output-axis points (C2)

routing:                        # 3.4
  theta1_range: [0.00, 0.50]     # spec 0.20; widened for O-3 (Oct 11)
  theta2_range: [0.50, 1.00]     # spec 0.80; widened for O-3 (user, Oct 11)
  step: 0.01
  quality: F1
  cost: latency_total           # pluggable; primary metric per 3.4

actions:                        # 1; stage 3 pins chosen as defaults Oct 11 (DECISIONS 14)
  top_n: 5                      # passages given to the generator, every action
  a1_rerank: 20                 # passages the cross-encoder re-scores for A1
  a2_rerank: 30                 # passages the cross-encoder re-scores after the A2 merge
  cross_encoder: cross-encoder/ms-marco-MiniLM-L-6-v2
  cross_encoder_revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  answer_prompt: "Answer the question using the passages below. Reply with the answer only: a short phrase of a few words, with no explanation. If it is a yes/no question, reply yes or no."
  rewrite_prompt: "Rewrite this question as a search query that will find Wikipedia passages answering it. Keep every name and detail in the question. Reply with the query only."
  temperature: 0.0              # answers and rewrites (7.5)
  seed: 42
  answer_max_tokens: 32
  rewrite_max_tokens: 64

baselines:                      # 5
  b1_weight_step: 0.25          # B1 weight lattice: 35 vectors summing to 1
  b2_t_max: 8                   # ordinal sum t ranges 0..8; cut points 0 <= c1 < c2 <= 9

calibration:                    # 7.3
  quantile: 75
  cluster_size: 3               # incomplete clusters are skipped

splits:                         # 7.1
  seed: 42
  names: [train, val, test]     # 60 / 20 / 20

evaluation:                     # 6
  oracle_delta: 0.02            # 6.1; also HRFR's delta (6.2)
  bootstrap_resamples: 1000     # 6.3
  ci_level: 0.95                # percentile intervals (user decision, Oct 8)
  bootstrap_seed: 42

# Written by the fitting steps on training / validation data; empty until stage 1.
fitted:
  scalers: null                 # p5 / p95 per signal per dataset (2.6)
  widths: null                  # calibrated band width per signal, B4 (7.3)
  thresholds: null              # theta1, theta2 selected on validation (3.4)
